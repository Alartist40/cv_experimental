[workspace]
resolver = "2"
members = [
    "crates/store",
    "crates/vision",
    "crates/detect",
    "crates/hubd",
    "crates/camproxy",
]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
